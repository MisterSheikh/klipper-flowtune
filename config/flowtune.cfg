# Generic FlowTune configuration template for unvalidated Klipper machines.
#
# The Qidi Q2 is currently the only tested platform. Other machines require an
# existing compatible load-cell integration and must be validated by their
# operator. FlowTune does not configure load-cell hardware or probing.

[flowtune]
# REQUIRED MACHINE-SPECIFIC EDIT:
# Enter the name of an existing Klipper load-cell configuration section without
# brackets. FlowTune reports an error if it cannot read load-cell measurements
# from the selected section. "load_cell" is an example for [load_cell].
load_cell_object: load_cell

# REQUIRED MACHINE-SPECIFIC EDIT:
# Use an absolute directory writable by the account running Klipper. A path
# inside printer_data/config is normally visible in Mainsail or Fluidd.
output_dir: /path/to/printer_data/config/flowtune/results

# Sensor-data quality checks. These defaults detect captures with too many
# missing or delayed samples and normally should remain unchanged.
capture_duration: 2.0
minimum_sample_rate_ratio: 0.90
maximum_gap_intervals: 1.5
# Maximum sensor-data batches temporarily buffered while writing a capture.
writer_queue_batches: 16
