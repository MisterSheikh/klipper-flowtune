# FlowTune reference configuration for a Qidi Q2 running mainline Klipper.
#
# FlowTune reads the Q2's CS1237 load cell through the existing
# [load_cell_probe] configuration. Do not add a separate CS1237 configuration
# or duplicate its ADC pin settings for FlowTune.

[flowtune]
load_cell_object: load_cell_probe
# KIAUH/mainline-Q2 path. Captures are visible in the printer configuration
# tree and writable by the Klipper service account.
output_dir: /home/mks/printer_data/config/flowtune/results
capture_duration: 2.0
minimum_sample_rate_ratio: 0.90
maximum_gap_intervals: 1.5
# Leave this at the tested default unless FlowTune reports that the capture
# writer cannot keep up with the sensor data.
writer_queue_batches: 16
